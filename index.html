<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vertical Rhythm Lab</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:white;font-family:Arial;text-align:center;overflow:hidden}
h2{margin:10px;font-size:20px}
button,label{background:#292943;color:white;border:1px solid #555;
padding:10px;margin:4px;border-radius:8px;display:inline-block}
input{max-width:180px}
#game{position:relative;width:100vw;height:75vh;max-width:600px;margin:auto;
background:#171725;display:flex}
.lane{width:25%;height:100%;border-left:1px solid #444;position:relative}
.note{position:absolute;width:55px;height:55px;border-radius:50%;
transform:translateX(-50%);display:flex;align-items:center;justify-content:center;
font-size:28px;color:white;font-weight:bold}
#hit{position:absolute;bottom:45px;left:0;width:100%;height:5px;background:white}
#buttons{display:flex;width:100%;max-width:600px;margin:auto}
.key{width:25%;height:70px;font-size:30px;background:#25253c}
#editor{display:none}
#info{font-size:13px;margin:5px}
</style>
</head>

<h2>🎵 Vertical Rhythm Lab</h2>

<div id="menu">

</div>

<div id="editor">
<p>Editor: reproduce la canción y toca un carril para colocar una nota.</p>
<button onclick="toggleMusica()">▶ / ⏸</button>
<button onclick="borrar()">🗑 Borrar última</button>
<button onclick="menu()">↩ Menú</button>
</div>

<div class="lane" data-l="3"></div>
<div id="hit"></div>
</div>
